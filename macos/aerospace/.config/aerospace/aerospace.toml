# ─────────────────────────────────────────────────────────────
#  AeroSpace — gestion des ESPACES uniquement (Guillaume)
#  Pas de mosaïque : toutes les fenêtres sont flottantes (règle en fin de fichier).
#  Le placement des fenêtres est fait par Tinycast (⌃⌥ + flèches).
#  Emplacement : ~/.config/aerospace/aerospace.toml
#  Doc         : https://nikitabobko.github.io/AeroSpace/guide
#  Recharger   : Super + Maj + R
#
#  Super = Caps Lock maintenu = ⌘⌥⌃ (Karabiner) → cmd-alt-ctrl
#  Super + Maj                                   → cmd-alt-ctrl-shift
#
#  Les noms de touches sont ceux du clavier QWERTY (positions physiques).
#  Sur AZERTY : la touche W s'appelle « z », les touches ) et - à droite
#  du 0 s'appellent « minus » et « equal ».
# ─────────────────────────────────────────────────────────────

config-version = 2

# Espaces 1 à 9 toujours présents, même vides
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0"]

start-at-login = true

# JankyBorders démarre avec AeroSpace (lit ~/.config/borders/bordersrc)
after-startup-command = ['exec-and-forget borders']

# Prévient SketchyBar à chaque changement d'espace
exec-on-workspace-change = [
  '/bin/bash', '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE',
]

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Cmd+Tab vers une app d'un autre espace : afficher l'espace de la fenêtre
on-focus-changed = [
  'exec-and-forget ws=$(/opt/homebrew/bin/aerospace list-windows --focused --format "%{workspace}") && [ -n "$ws" ] && /opt/homebrew/bin/aerospace workspace "$ws"',
]

automatically-unhide-macos-hidden-apps = false

[key-mapping]
preset = 'qwerty'

[mode.main.binding]
# ── Espaces ──────────────────────────────────────────────────
# Super + 1…9 : aller à l'espace
cmd-alt-ctrl-1 = 'workspace 1'
cmd-alt-ctrl-2 = 'workspace 2'
cmd-alt-ctrl-3 = 'workspace 3'
cmd-alt-ctrl-4 = 'workspace 4'
cmd-alt-ctrl-5 = 'workspace 5'
cmd-alt-ctrl-6 = 'workspace 6'
cmd-alt-ctrl-7 = 'workspace 7'
cmd-alt-ctrl-8 = 'workspace 8'
cmd-alt-ctrl-9 = 'workspace 9'
cmd-alt-ctrl-0 = 'workspace 0'

# Super + Maj + 1…9 : envoyer la fenêtre vers l'espace (et la suivre)
cmd-alt-ctrl-shift-1 = 'move-node-to-workspace --focus-follows-window 1'
cmd-alt-ctrl-shift-2 = 'move-node-to-workspace --focus-follows-window 2'
cmd-alt-ctrl-shift-3 = 'move-node-to-workspace --focus-follows-window 3'
cmd-alt-ctrl-shift-4 = 'move-node-to-workspace --focus-follows-window 4'
cmd-alt-ctrl-shift-5 = 'move-node-to-workspace --focus-follows-window 5'
cmd-alt-ctrl-shift-6 = 'move-node-to-workspace --focus-follows-window 6'
cmd-alt-ctrl-shift-7 = 'move-node-to-workspace --focus-follows-window 7'
cmd-alt-ctrl-shift-8 = 'move-node-to-workspace --focus-follows-window 8'
cmd-alt-ctrl-shift-9 = 'move-node-to-workspace --focus-follows-window 9'
cmd-alt-ctrl-shift-0 = 'move-node-to-workspace --focus-follows-window 0'

# Super + Tab / Super + Maj + Tab : espace suivant / précédent
cmd-alt-ctrl-tab       = 'workspace --wrap-around next'
cmd-alt-ctrl-shift-tab = 'workspace --wrap-around prev'

# ── Fenêtres ─────────────────────────────────────────────────
# Super + flèches : focus
cmd-alt-ctrl-left  = 'focus left'
cmd-alt-ctrl-down  = 'focus down'
cmd-alt-ctrl-up    = 'focus up'
cmd-alt-ctrl-right = 'focus right'

# Super + W (touche « z » en QWERTY) : fermer la fenêtre
cmd-alt-ctrl-z = 'close'

# ── Applications ─────────────────────────────────────────────
# Super + Entrée : terminal
cmd-alt-ctrl-enter = 'exec-and-forget open -na Ghostty'
# Super + Maj + Entrée : navigateur (nouvelle fenêtre)
cmd-alt-ctrl-shift-enter = 'exec-and-forget open -na "Firefox Developer Edition" --args --new-window'
# Super + Maj + F : Finder
cmd-alt-ctrl-shift-f = 'exec-and-forget open ~'
# Super + Maj + N : éditeur
cmd-alt-ctrl-shift-n = 'exec-and-forget open -a Zed'
# Super + Maj + O : Obsidian
cmd-alt-ctrl-shift-o = 'exec-and-forget open -a Obsidian'
# Super + Maj + W (touche « z » en QWERTY) : Typora
cmd-alt-ctrl-shift-z = 'exec-and-forget open -a Typora'
# Super + Maj + D : lazydocker
cmd-alt-ctrl-shift-d = 'exec-and-forget open -na Ghostty --args -e /opt/homebrew/bin/lazydocker'

# ── AeroSpace ────────────────────────────────────────────────
# Super + Maj + R : recharger la config
cmd-alt-ctrl-shift-r = 'reload-config'

# ── Toutes les fenêtres en flottant ──────────────────────────
# AeroSpace ne sert qu'à changer d'espace (Super + 0…9) et à y envoyer des
# fenêtres (Super + Maj + 0…9). Les onglets natifs (Finder, Ghostty) ne posent
# donc plus de problème.
# Pour revenir à la mosaïque : supprimer ce bloc et rétablir les réglages
# default-root-container-layout / [gaps] (voir l'historique git).
[[on-window-detected]]
if = 'true'          # toutes les fenêtres
run = 'layout floating'
