# Starship — Catppuccin Mocha, sobre, sur une ligne
"$schema" = 'https://starship.rs/config-schema.json'

palette = "catppuccin_mocha"
add_newline = true
command_timeout = 800

format = """
$directory\
$git_branch\
$git_state\
$git_status\
$nodejs$python$golang$ruby$php\
$docker_context\
$cmd_duration\
$line_break\
$character"""

right_format = """$status$time"""

[directory]
style = "bold lavender"
truncation_length = 4
truncate_to_repo = true
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "mauve"
format = "[$symbol$branch]($style) "

[git_status]
style = "peach"
format = '([$all_status$ahead_behind]($style) )'

[git_state]
style = "yellow"

[nodejs]
symbol = " "
style = "green"
format = "[$symbol$version]($style) "

[python]
symbol = " "
style = "yellow"
format = '[$symbol$version( \($virtualenv\))]($style) '

[golang]
symbol = " "
style = "sapphire"
format = "[$symbol$version]($style) "

[ruby]
symbol = " "
style = "red"
format = "[$symbol$version]($style) "

[php]
symbol = " "
style = "lavender"
format = "[$symbol$version]($style) "

[docker_context]
symbol = " "
style = "blue"
format = "[$symbol$context]($style) "
only_with_files = true

[cmd_duration]
min_time = 2000
style = "overlay1"
format = "[󱎫 $duration]($style) "

[status]
disabled = false
style = "red"
format = "[✘ $status]($style) "

[time]
disabled = true

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
